<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KauMae（買う前）</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">予定外購入を、買う前に一度だけ見直す</p>
        <h1>KauMae <span>買う前</span></h1>
        <p class="lead">全部の衝動買いを止めるのではなく、後悔しそうな買い物だけをカロリーと過去メモで確認するアプリ。</p>
      </div>
      <button class="ghost-button" id="resetDemo" type="button">デモリセット</button>
    </header>

    <nav class="step-nav" id="stepNav" aria-label="画面切り替え">
      <button data-view="plan" class="active" type="button"><span>1</span>買い物前</button>
      <button data-view="store" type="button"><span>2</span>店内</button>
      <button data-view="review" type="button"><span>3</span>購入後</button>
      <button data-view="history" type="button"><span>4</span>記録</button>
    </nav>

    <main class="app-card" id="screenRoot" aria-live="polite"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
